[package]
name = "gtd-app"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = "1.18.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true
